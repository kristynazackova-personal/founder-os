# Proves the Anthropic Workload Identity Federation setup works end to end.
#
# The Console wizard's last step listens for a real token exchange, and only a
# running GitHub Actions job can obtain the JWT it needs - there is no way to
# do this from a laptop. Pushing to main triggers this, which is what the
# federation rule matches (event_name: push, ref: refs/heads/main).
#
# Delete this workflow once the exchange is confirmed. It is a probe, not CI.
name: WIF smoke test

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    env:
      # Repository variables, NOT secrets: Settings -> Secrets and variables ->
      # Actions -> Variables. None of the three is a credential, and a masked
      # secret would hide a wrong value in the logs instead of showing it.
      #
      # ANTHROPIC_ORGANIZATION_ID is a UUID from the Console's Settings ->
      # Organization. It is NOT the GitHub numeric owner id that went into the
      # federation rule's match conditions.
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
    steps:
      - name: Check the variables are set
        run: |
          set -euo pipefail
          # An unset repository variable is an empty string, not an error, so
          # without this the job sends a blank rule id and fails at the
          # exchange - which reads like a broken rule rather than a typo.
          missing=""
          for v in ANTHROPIC_ORGANIZATION_ID ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_SERVICE_ACCOUNT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set as repository variables:$missing"
            echo "Settings -> Secrets and variables -> Actions -> Variables tab."
            exit 1
          fi
          case "$ANTHROPIC_FEDERATION_RULE_ID" in fdrl_*) ;; *)
            echo "::error::ANTHROPIC_FEDERATION_RULE_ID should start with fdrl_"; exit 1 ;; esac
          case "$ANTHROPIC_SERVICE_ACCOUNT_ID" in svac_*) ;; *)
            echo "::error::ANTHROPIC_SERVICE_ACCOUNT_ID should start with svac_"; exit 1 ;; esac
          # The commonest mix-up: pasting the GitHub numeric owner id here.
          case "$ANTHROPIC_ORGANIZATION_ID" in
            *-*-*-*-*) ;;
            *) echo "::error::ANTHROPIC_ORGANIZATION_ID should be a UUID from the Console's Settings -> Organization, not the GitHub owner id."; exit 1 ;;
          esac
          echo "All three set."
      - name: Fetch the GitHub OIDC token
        run: |
          set -euo pipefail
          # The audience has to be requested explicitly. GitHub's default
          # audience is the owner URL, which the rule will not accept.
          JWT=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value)
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "::error::No OIDC token. Is permissions.id-token set to write?"
            exit 1
          fi
          echo "::add-mask::$JWT"
          echo "JWT=$JWT" >> "$GITHUB_ENV"
          # The claims, not the signature. Useful when the rule does not match:
          # compare these against the rule's conditions.
          #
          # base64url payloads are unpadded, and `base64 -d` exits non-zero on
          # them even after writing the decoded bytes. Under `pipefail` that
          # sank the whole job on its last line, after the token had already
          # been fetched. A diagnostic must never be able to fail the step, so
          # the padding is restored and the whole thing ends in `|| true`.
          echo "Claims the rule is matched against:"
          claims() {
            local payload
            payload=$(echo "$JWT" | cut -d. -f2 | tr '_-' '/+')
            case $(( ${#payload} % 4 )) in
              2) payload="$payload==" ;;
              3) payload="$payload=" ;;
            esac
            echo "$payload" | base64 -d | jq '{iss, sub, aud, repository, repository_owner, repository_owner_id, ref, event_name}'
          }
          claims || true

      - name: Exchange it for an Anthropic token
        run: |
          set -euo pipefail
          BODY=$(jq -n \
            --arg assertion "$JWT" \
            --arg rule "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg org "$ANTHROPIC_ORGANIZATION_ID" \
            --arg sa "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: $assertion, federation_rule_id: $rule,
              organization_id: $org, service_account_id: $sa}')
          STATUS=$(curl -sS -o /tmp/oauth.json -w '%{http_code}' \
            https://api.anthropic.com/v1/oauth/token \
            -H 'content-type: application/json' -d "$BODY")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Exchange failed with HTTP $STATUS."
            # The message is fixed ("Authentication failed") but the error TYPE
            # and the request id are not, and they separate "the rule did not
            # match" from "there was no rule to match against" - which is what
            # an exchange missing from the authentication history looks like.
            echo "Response body:"
            cat /tmp/oauth.json
            echo
            echo "Sent with: rule=$ANTHROPIC_FEDERATION_RULE_ID org=$ANTHROPIC_ORGANIZATION_ID sa=$ANTHROPIC_SERVICE_ACCOUNT_ID"
            echo "Deny reasons are logged at"
            echo "https://platform.claude.com/settings/workload-identity-federation?tab=history"
            exit 1
          fi
          TOKEN=$(jq -r .access_token /tmp/oauth.json)
          echo "::add-mask::$TOKEN"
          echo "ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # Never print the token itself. Its shape is enough to confirm.
          case "$TOKEN" in
            sk-ant-oat01-*) echo "Exchanged. Valid for $(jq -r .expires_in /tmp/oauth.json)s." ;;
            *) echo "::error::Unexpected token format."; exit 1 ;;
          esac

      - name: Call the API with it
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/msg.json -w '%{http_code}' \
            https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $ACCESS_TOKEN" \
            -H 'anthropic-version: 2023-06-01' \
            -H 'content-type: application/json' \
            -d '{"model":"claude-opus-5","max_tokens":16,
                 "messages":[{"role":"user","content":"Reply with the word: ok"}]}')
          if [ "$STATUS" != "200" ]; then
            echo "::error::The token was minted but the API rejected it (HTTP $STATUS)."
            echo "Check the rule's OAuth scope and that the service account is a"
            echo "member of the rule's workspace."
            jq -r '.error.message // empty' /tmp/msg.json
            exit 1
          fi
          echo "Claude replied: $(jq -r '.content[] | select(.type=="text") | .text' /tmp/msg.json)"
          echo "Federation works. Delete this workflow."
